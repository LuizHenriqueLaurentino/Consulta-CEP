<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta de CEP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f7ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      color: #1a1a2e;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a7f4f;
    }
    header p {
      color: #5a7a8a;
      font-size: 14px;
      margin-top: 6px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 28px;
      width: 100%;
      max-width: 520px;
    }

    .search-card { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3a5a6a;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      border: 1.5px solid #b0d4e8;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #1a9e6b; }
    input[type="text"]::placeholder { color: #aac4d0; letter-spacing: 1px; font-size: 14px; }

    button {
      background: #1a9e6b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #158055; }
    button:disabled { background: #a0c8b8; cursor: not-allowed; }

    .hint { font-size: 12px; color: #90aab8; margin-top: 8px; }

    .error {
      display: none;
      background: #fff0f3;
      border: 1px solid #f5aab8;
      border-radius: 8px;
      padding: 10px 14px;
      color: #c0304a;
      font-size: 13px;
      margin-top: 12px;
    }
    .error.show { display: block; }

    .loader {
      display: none;
      text-align: center;
      padding: 28px 0;
      color: #5a8a9a;
      font-size: 13px;
    }
    .loader.show { display: block; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #d0eaf5;
      border-top-color: #1a9e6b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }

    .result-card { display: none; }
    .result-card.show { display: block; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid #e0f0f8;
    }
    .result-header h2 {
      font-size: 15px;
      color: #1a7f4f;
      font-weight: 700;
    }
    .cep-badge {
      background: #e8f7f1;
      color: #1a7f4f;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .addr-main { margin-bottom: 18px; }
    .addr-main .street {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .addr-main .complement {
      font-size: 13px;
      color: #7a9aaa;
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    tr { border-bottom: 1px solid #edf5fa; }
    tr:last-child { border-bottom: none; }
    td { padding: 9px 4px; vertical-align: middle; }
    td:first-child {
      width: 38%;
      color: #6a8a9a;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    td:last-child { color: #1a1a2e; font-size: 14px; }
    .empty { color: #b0c8d0; font-style: italic; font-size: 13px; }

    .history { margin-top: 20px; width: 100%; max-width: 520px; }
    .history h3 {
      font-size: 12px;
      font-weight: 600;
      color: #7a9aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: #fff;
      border: 1.5px solid #b0d4e8;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 12px;
      color: #3a6a8a;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .chip:hover { border-color: #1a9e6b; color: #1a7f4f; background: #f0faf5; }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #90aab8;
    }
    footer a { color: #1a9e6b; text-decoration: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>📍 Consulta de CEP</h1>
    <p>Informe um CEP para consultar o endereço completo.</p>
  </header>

  <div class="card search-card">
    <label for="cepInput">CEP</label>
    <div class="input-row">
      <input id="cepInput" type="text" placeholder="00000-000" maxlength="9" inputmode="numeric" autocomplete="postal-code"/>
      <button id="btnBuscar" onclick="buscarCEP()">Buscar</button>
    </div>
    <p class="hint">Digite o CEP e pressione Enter ou clique em Buscar.</p>
    <div class="error" id="erro"></div>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    Consultando endereço…
  </div>

  <div class="card result-card" id="resultado">
    <div class="result-header">
      <h2>Endereço encontrado</h2>
      <span class="cep-badge" id="cepBadge">—</span>
    </div>
    <div class="addr-main">
      <div class="street" id="rLogradouro">—</div>
      <div class="complement" id="rComplemento"></div>
    </div>
    <table id="tabelaDados"></table>
  </div>

  <div class="history" id="historico" style="display:none">
    <h3>Buscas recentes</h3>
    <div class="chips" id="chips"></div>
  </div>

  <footer>
    Dados fornecidos por <a href="https://viacep.com.br" target="_blank">viacep.com.br</a>
  </footer>

  <script>
    const input     = document.getElementById('cepInput');
    const loader    = document.getElementById('loader');
    const resultado = document.getElementById('resultado');
    const erroBox   = document.getElementById('erro');

    input.addEventListener('input', () => {
      let v = input.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
      input.value = v;
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') buscarCEP(); });

    let hist = JSON.parse(sessionStorage.getItem('hist') || '[]');

    function salvarHist(cep, local, uf) {
      hist = hist.filter(h => h.cep !== cep);
      hist.unshift({ cep, local, uf });
      if (hist.length > 5) hist.pop();
      sessionStorage.setItem('hist', JSON.stringify(hist));
      renderHist();
    }

    function renderHist() {
      const sec = document.getElementById('historico');
      const con = document.getElementById('chips');
      if (!hist.length) { sec.style.display = 'none'; return; }
      sec.style.display = 'block';
      con.innerHTML = hist.map(h =>
        `<button class="chip" onclick="buscarDireto('${h.cep}')">${h.cep} · ${h.local}/${h.uf}</button>`
      ).join('');
    }

    function buscarDireto(cep) {
      input.value = cep;
      buscarCEP();
    }

    async function buscarCEP() {
      const raw = input.value.replace(/\D/g, '');
      erroBox.className = 'error';
      resultado.className = 'card result-card';
      loader.className = 'loader';

      if (raw.length !== 8) {
        erroBox.textContent = '⚠️ Digite um CEP válido com 8 dígitos.';
        erroBox.className = 'error show';
        return;
      }

      document.getElementById('btnBuscar').disabled = true;
      loader.className = 'loader show';

      try {
        const res = await fetch(`https://viacep.com.br/ws/${raw}/json/`);
        if (!res.ok) throw new Error();
        const d = await res.json();

        if (d.erro) {
          erroBox.textContent = '❌ CEP não encontrado. Verifique e tente novamente.';
          erroBox.className = 'error show';
          return;
        }

        renderResultado(d);
        salvarHist(d.cep, d.localidade, d.uf);

      } catch {
        erroBox.textContent = '❌ Erro ao conectar à API. Verifique sua conexão.';
        erroBox.className = 'error show';
      } finally {
        loader.className = 'loader';
        document.getElementById('btnBuscar').disabled = false;
      }
    }

    function val(v) {
      return v?.trim() ? v : '<span class="empty">Não informado</span>';
    }

    function renderResultado(d) {
      document.getElementById('cepBadge').textContent    = d.cep || '—';
      document.getElementById('rLogradouro').textContent = d.logradouro || 'Logradouro não informado';
      document.getElementById('rComplemento').textContent = d.complemento || '';

      const linhas = [
        ['Bairro',     d.bairro],
        ['Unidade',    d.unidade],
        ['Localidade', d.localidade],
        ['UF',         d.uf],
        ['Estado',     d.estado],
        ['Região',     d.regiao],
        ['DDD',        d.ddd],
        ['IBGE',       d.ibge],
        ['GIA',        d.gia],
        ['SIAFI',      d.siafi],
      ];

      document.getElementById('tabelaDados').innerHTML = linhas.map(([label, valor]) => `
        <tr><td>${label}</td><td>${val(valor)}</td></tr>
      `).join('');

      resultado.className = 'card result-card show';
      resultado.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    renderHist();
  </script>
</body>
</html>
